# Site
title: yhW的个人博客
subtitle: 记录技术、生活与思考
description: WYH 的个人博客，记录技术、生活与思考
keywords: 博客, 技术, 生活
author: WYH
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://yhuwa.com
root: /
permalink: posts/:year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 1
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Pagination
per_page: 10
pagination_dir: page

# Metadata
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Extensions
theme: butterfly
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
category_generator:
  per_page: 10
tag_generator:
  per_page: 10
feed:
  type: atom
  path: atom.xml
  limit: 20
sitemap:
  path: sitemap.xml

# Deployment is handled by .github/workflows/pages.yml
deploy: {}
